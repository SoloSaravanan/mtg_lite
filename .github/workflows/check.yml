name: Build and Release

on:
  push:
    branches:
      - cinnamonbun
  pull_request:
    branches:
      - cinnamonbun

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt -y install python3-parse

          curl --fail --location --silent --show-error --output aapt2.jar https://dl.google.com/android/maven2/com/android/tools/build/aapt2/8.12.0-alpha05-12782657/aapt2-8.12.0-alpha05-12782657-linux.jar
          sudo unzip -o -d /usr/bin aapt2.jar aapt2
          rm aapt2.jar

      - uses: actions/checkout@v6

      - run: ./cicd/verify-permissions.py

      - run: make gapps_arm64

      - uses: actions/upload-artifact@v7
        with:
          path: out/MindTheGapps-Lite-*-arm64-*.zip
          if-no-files-found: error
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: out/MindTheGapps-Lite-*-arm64-*.zip.sha256sum
          if-no-files-found: error
          archive: false

  publish:
    name: Publish arm64 prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/cinnamonbun'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: MindTheGapps-Lite-*-arm64-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          test -n "$GH_TOKEN"

          mapfile -d '' packages < <(find release-assets -type f -name 'MindTheGapps-Lite-*-arm64-*.zip' -print0)
          mapfile -d '' checksums < <(find release-assets -type f -name 'MindTheGapps-Lite-*-arm64-*.zip.sha256sum' -print0)
          echo "::notice title=Release diagnostic::Found ${#packages[@]} ZIP file(s) and ${#checksums[@]} checksum file(s)"
          if (( ${#packages[@]} != 1 || ${#checksums[@]} != 1 )); then
            available_files="$(find release-assets -type f -printf '%P, ' 2>/dev/null || true)"
            printf '::error title=Release artifact discovery failed::Found %d ZIP file(s) and %d checksum file(s). Downloaded files: %s\n' "${#packages[@]}" "${#checksums[@]}" "$available_files"
            echo "Expected exactly one arm64 ZIP and checksum" >&2
            find release-assets -type f -printf '%P\n' >&2
            exit 1
          fi

          package="${packages[0]}"
          checksum_source="${checksums[0]}"
          checksum="$package.sha256sum"
          if [ "$checksum_source" != "$checksum" ]; then
            cp -- "$checksum_source" "$checksum"
          fi

          printf 'Release package: %s\nChecksum: %s\n' "$package" "$checksum"
          (
            cd "$(dirname "$package")"
            sha256sum -c "$(basename "$checksum")"
          )
          echo "::notice title=Release diagnostic::ZIP checksum verified"

          version="$(basename "$package" | cut -d- -f3)"
          tag="mindthegapps-lite-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::notice title=Release diagnostic::Creating prerelease for $(basename "$package")"
          if release_output="$(gh release create "$tag" "$package" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MindTheGapps-Lite $version arm64 build $GITHUB_RUN_NUMBER" \
            --notes "Automated arm64 prerelease from cinnamonbun at $GITHUB_SHA." \
            --prerelease \
            --latest=false 2>&1)"; then
            printf '%s\n' "$release_output"
          else
            status=$?
            details="${release_output//$GH_TOKEN/[REDACTED]}"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            printf '::error title=GitHub prerelease failed::%s\n' "$details"
            {
              printf 'Release command failed with exit code %s.\n\n' "$status"
              printf '%s\n' "$release_output"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
